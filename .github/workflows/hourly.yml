name: DXY M5 visible chart
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: dxy-visible-chart
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python collect_visible.py
      - name: Publish only market data
        run: |
          git config user.name 'gold-macro-collector'
          git config user.email 'collector@users.noreply.github.com'
          git add data/latest.json
          git diff --staged --quiet || git commit -m 'Update closed DXY M5 observations'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-evidence
          path: |
            data/*.png
            data/observations.json
          retention-days: 7
