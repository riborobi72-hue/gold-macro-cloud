name: GOLD MACRO TradingView M5
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dxy-visible-chart
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python collect_visible.py
      - name: Publish only market data
        if: always()
        run: |
          git config user.name 'gold-macro-collector'
          git config user.email 'collector@users.noreply.github.com'
          find data -type f \( -name latest.json -o -name health.json \) -print0 | xargs -0 -r git add --
          git diff --staged --quiet || git commit -m 'Update closed TradingView M5 observations'
          git push
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capture-evidence
          path: |
            data/**/*.png
            data/**/observations.json
          retention-days: 7
